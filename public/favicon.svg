<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C1917" />
      <stop offset="50%" stop-color="#09090B" />
      <stop offset="100%" stop-color="#292524" />
    </linearGradient>

    <!-- Gold Metallic Gradient -->
    <linearGradient id="goldMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="25%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="75%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Gold Border Gradient -->
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#D97706" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.9" />
    </linearGradient>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#F59E0B" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="60" height="60" rx="16" stroke="url(#goldBorder)" stroke-width="2" />

  <!-- V2B Text / Emblem -->
  <g filter="url(#goldGlow)">
    <text x="32" y="42" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-weight="900" font-size="24" fill="url(#goldMetallic)" text-anchor="middle" letter-spacing="1">V2B</text>
  </g>

  <!-- Sparkle Accent Top Left -->
  <path d="M14 12 L15 15 L18 16 L15 17 L14 20 L13 17 L10 16 L13 15 Z" fill="#FDE68A" />
  
  <!-- Sparkle Accent Bottom Right -->
  <path d="M50 46 L51 48 L53 49 L51 50 L50 52 L49 50 L47 49 L49 48 Z" fill="#FDE68A" opacity="0.85" />
</svg>
